<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 520" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>The Stategraph platform</title>
  <desc>Architecture: pull requests, the CLI, the API, and AI agents connect to the Stategraph platform. Orchestration runs on top of Infrastructure as a Database, which together power policy, remote execution, inventory, cost, security, and compliance.</desc>
  <defs>
    <marker id="hf-arrowhead-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a0a0a0" opacity="0.7"/>
    </marker>
    <marker id="hf-arrowhead-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <style>
    .hf-col-label { fill: #a0a0a0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; }
    .hf-node { fill: #1a1a1a; stroke: #2a2a2a; stroke-width: 2; }
    .hf-node-label { fill: #e4e4e4; font-size: 16px; font-weight: 500; }
    .hf-node-dot-in { fill: #a0a0a0; opacity: 0.6; }
    .hf-node-dot-out { fill: #60a5fa; }
    .hf-arrow-in { stroke: #a0a0a0; stroke-width: 1.5; fill: none; }
    .hf-arrow-out { stroke: #60a5fa; stroke-width: 1.5; fill: none; }
    .hf-core-bg { fill: rgba(96,165,250,0.08); stroke: #60a5fa; stroke-width: 2; }
    .hf-core-inner { fill: #60a5fa; opacity: 0.12; }
    .hf-core-eyebrow { fill: #60a5fa; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; }
    .hf-core-title { fill: #e4e4e4; font-size: 22px; font-weight: 700; }
    .hf-core-layer { fill: #e4e4e4; font-size: 18px; font-weight: 700; }
    .hf-core-orch { fill: rgba(16,185,129,0.14); stroke: #10b981; stroke-width: 1.5; }
    .hf-core-db { fill: rgba(96,165,250,0.22); stroke: #60a5fa; stroke-width: 1.5; }
    .hf-core-sub { fill: #a0a0a0; font-size: 13px; }
  </style>

  <g transform="translate(30, 25)">
    <text class="hf-col-label" x="140" y="22" text-anchor="middle">Clients</text>
    <text class="hf-col-label" x="650" y="22" text-anchor="middle">Server</text>
    <text class="hf-col-label" x="1160" y="22" text-anchor="middle">Capabilities</text>

    <g>
      <rect class="hf-node" x="20"  y="115" width="240" height="48" rx="24"/>
      <circle class="hf-node-dot-in" cx="44" cy="139" r="4"/>
      <text class="hf-node-label" x="152" y="145" text-anchor="middle">Pull Requests</text>

      <rect class="hf-node" x="20"  y="179" width="240" height="48" rx="24"/>
      <circle class="hf-node-dot-in" cx="44" cy="203" r="4"/>
      <text class="hf-node-label" x="152" y="209" text-anchor="middle">CLI</text>

      <rect class="hf-node" x="20"  y="243" width="240" height="48" rx="24"/>
      <circle class="hf-node-dot-in" cx="44" cy="267" r="4"/>
      <text class="hf-node-label" x="152" y="273" text-anchor="middle">API</text>

      <rect class="hf-node" x="20"  y="307" width="240" height="48" rx="24"/>
      <circle class="hf-node-dot-in" cx="44" cy="331" r="4"/>
      <text class="hf-node-label" x="152" y="337" text-anchor="middle">AI Agents</text>
    </g>

    <g fill="none" marker-end="url(#hf-arrowhead-in)">
      <path class="hf-arrow-in" d="M 260 139 C 320 139, 335 175, 388 175"/>
      <path class="hf-arrow-in" d="M 260 203 C 320 203, 350 215, 388 215"/>
      <path class="hf-arrow-in" d="M 260 267 C 320 267, 350 255, 388 255"/>
      <path class="hf-arrow-in" d="M 260 331 C 320 331, 335 295, 388 295"/>
    </g>

    <g>
      <rect class="hf-core-bg" x="390" y="115" width="520" height="240" rx="16"/>
      <text class="hf-core-eyebrow" x="650" y="147" text-anchor="middle">STATEGRAPH</text>
      <rect class="hf-core-orch" x="408" y="162" width="484" height="82" rx="12"/>
      <text class="hf-core-layer"  x="650" y="197" text-anchor="middle">Orchestration</text>
      <text class="hf-core-sub"    x="650" y="222" text-anchor="middle">plan and apply with pull requests</text>
      <rect class="hf-core-db" x="408" y="252" width="484" height="82" rx="12"/>
      <text class="hf-core-layer"  x="650" y="287" text-anchor="middle">Infrastructure as a Database</text>
      <text class="hf-core-sub"    x="650" y="312" text-anchor="middle">state as a dependency graph in PostgreSQL</text>
      <text class="hf-core-sub"    x="650" y="349" text-anchor="middle">queryable · governable · live</text>
    </g>

    <g fill="none" marker-end="url(#hf-arrowhead-out)">
      <path class="hf-arrow-out" d="M 913 175 C 970 175, 990 85,  1037 85"/>
      <path class="hf-arrow-out" d="M 913 205 C 970 205, 990 145, 1037 145"/>
      <path class="hf-arrow-out" d="M 913 235 C 970 235, 990 205, 1037 205"/>
      <path class="hf-arrow-out" d="M 913 265 C 970 265, 990 265, 1037 265"/>
      <path class="hf-arrow-out" d="M 913 295 C 970 295, 990 325, 1037 325"/>
      <path class="hf-arrow-out" d="M 913 325 C 970 325, 990 385, 1037 385"/>
    </g>

    <g>
      <rect class="hf-node" x="1040" y="61"  width="240" height="48" rx="24"/>
      <circle class="hf-node-dot-out" cx="1064" cy="85" r="4"/>
      <text class="hf-node-label" x="1172" y="91" text-anchor="middle">Policy Engine</text>

      <rect class="hf-node" x="1040" y="121" width="240" height="48" rx="24"/>
      <circle class="hf-node-dot-out" cx="1064" cy="145" r="4"/>
      <text class="hf-node-label" x="1172" y="151" text-anchor="middle">Remote Execution</text>

      <rect class="hf-node" x="1040" y="181" width="240" height="48" rx="24"/>
      <circle class="hf-node-dot-out" cx="1064" cy="205" r="4"/>
      <text class="hf-node-label" x="1172" y="211" text-anchor="middle">Inventory</text>

      <rect class="hf-node" x="1040" y="241" width="240" height="48" rx="24"/>
      <circle class="hf-node-dot-out" cx="1064" cy="265" r="4"/>
      <text class="hf-node-label" x="1172" y="271" text-anchor="middle">Cost</text>

      <rect class="hf-node" x="1040" y="301" width="240" height="48" rx="24"/>
      <circle class="hf-node-dot-out" cx="1064" cy="325" r="4"/>
      <text class="hf-node-label" x="1172" y="331" text-anchor="middle">Security</text>

      <rect class="hf-node" x="1040" y="361" width="240" height="48" rx="24"/>
      <circle class="hf-node-dot-out" cx="1064" cy="385" r="4"/>
      <text class="hf-node-label" x="1172" y="391" text-anchor="middle">Compliance</text>
    </g>
  </g>
</svg>
