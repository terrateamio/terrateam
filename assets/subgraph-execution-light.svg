<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>Serial execution behind a global lock versus subgraph execution with Stategraph</title>
  <desc>Two terminal panels. Left: terraform apply behind a global lock applies eight resources one at a time. Right: stategraph apply runs the same eight resources in dependency order, with independent resources applying in parallel and finishing in roughly half the time.</desc>
  <style>
    .bar {
      transform-box: fill-box;
      transform-origin: left center;
      transform: scaleX(0);
      animation-duration: 12s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    .done {
      opacity: 0;
      animation-duration: 12s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    .s0 { animation-name: s0; } .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; }
    .s4 { animation-name: s4; } .s5 { animation-name: s5; } .s6 { animation-name: s6; } .s7 { animation-name: s7; }
    .p0 { animation-name: p0; } .p1 { animation-name: p1; } .p2 { animation-name: p2; } .p3 { animation-name: p3; }
    .dL { animation-name: dL; } .dR { animation-name: dR; }
    @keyframes s0 { 0% { transform: scaleX(0); opacity: 1; } 9.17% { transform: scaleX(1); } 96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes s1 { 0%, 9.17% { transform: scaleX(0); opacity: 1; } 18.33% { transform: scaleX(1); } 96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes s2 { 0%, 18.33% { transform: scaleX(0); opacity: 1; } 27.5% { transform: scaleX(1); } 96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes s3 { 0%, 27.5% { transform: scaleX(0); opacity: 1; } 36.67% { transform: scaleX(1); } 96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes s4 { 0%, 36.67% { transform: scaleX(0); opacity: 1; } 45.83% { transform: scaleX(1); } 96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes s5 { 0%, 45.83% { transform: scaleX(0); opacity: 1; } 55% { transform: scaleX(1); } 96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes s6 { 0%, 55% { transform: scaleX(0); opacity: 1; } 64.17% { transform: scaleX(1); } 96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes s7 { 0%, 64.17% { transform: scaleX(0); opacity: 1; } 73.33% { transform: scaleX(1); } 96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes p0 { 0% { transform: scaleX(0); opacity: 1; } 9.17% { transform: scaleX(1); } 96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes p1 { 0%, 9.17% { transform: scaleX(0); opacity: 1; } 18.33% { transform: scaleX(1); } 96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes p2 { 0%, 18.33% { transform: scaleX(0); opacity: 1; } 27.5% { transform: scaleX(1); } 96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes p3 { 0%, 27.5% { transform: scaleX(0); opacity: 1; } 36.67% { transform: scaleX(1); } 96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes dL { 0%, 73.33% { opacity: 0; } 75% { opacity: 1; } 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes dR { 0%, 36.67% { opacity: 0; } 38% { opacity: 1; } 96% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .bar, .done { animation: none; }
      .bar { transform: scaleX(1); }
      .done { opacity: 1; }
    }
  </style>

  <!-- Left panel: serial execution -->
  <g>
    <rect x="20" y="20" width="448" height="400" rx="8" fill="#f0f0f0" stroke="#d0d0d0"/>
    <text x="36" y="48" font-size="14" fill="#0a0a0a">$ terraform apply</text>
    <text x="452" y="48" font-size="11" fill="#dc2626" text-anchor="end">global lock</text>
    <line x1="21" y1="62" x2="467" y2="62" stroke="#d0d0d0"/>

    <g font-size="12" fill="#404040">
      <text x="36" y="96">vpc</text>
      <text x="36" y="132">subnets</text>
      <text x="36" y="168">security</text>
      <text x="36" y="204">rds</text>
      <text x="36" y="240">alb</text>
      <text x="36" y="276">asg</text>
      <text x="36" y="312">route53</text>
      <text x="36" y="348">cloudfront</text>
    </g>
    <g fill="#e2e2e2">
      <rect x="150" y="85"  width="250" height="14" rx="3"/>
      <rect x="150" y="121" width="250" height="14" rx="3"/>
      <rect x="150" y="157" width="250" height="14" rx="3"/>
      <rect x="150" y="193" width="250" height="14" rx="3"/>
      <rect x="150" y="229" width="250" height="14" rx="3"/>
      <rect x="150" y="265" width="250" height="14" rx="3"/>
      <rect x="150" y="301" width="250" height="14" rx="3"/>
      <rect x="150" y="337" width="250" height="14" rx="3"/>
    </g>
    <g fill="#2563eb">
      <rect class="bar s0" x="150" y="85"  width="250" height="14" rx="3"/>
      <rect class="bar s1" x="150" y="121" width="250" height="14" rx="3"/>
      <rect class="bar s2" x="150" y="157" width="250" height="14" rx="3"/>
      <rect class="bar s3" x="150" y="193" width="250" height="14" rx="3"/>
      <rect class="bar s4" x="150" y="229" width="250" height="14" rx="3"/>
      <rect class="bar s5" x="150" y="265" width="250" height="14" rx="3"/>
      <rect class="bar s6" x="150" y="301" width="250" height="14" rx="3"/>
      <rect class="bar s7" x="150" y="337" width="250" height="14" rx="3"/>
    </g>
    <text x="36" y="396" font-size="11" fill="#404040">one change at a time</text>
    <text class="done dL" x="452" y="396" font-size="11" fill="#10b981" text-anchor="end">done</text>
  </g>

  <!-- Right panel: subgraph execution -->
  <g>
    <rect x="492" y="20" width="448" height="400" rx="8" fill="#f0f0f0" stroke="#d0d0d0"/>
    <text x="508" y="48" font-size="14" fill="#0a0a0a">$ stategraph apply</text>
    <text x="924" y="48" font-size="11" fill="#10b981" text-anchor="end">subgraph execution</text>
    <line x1="493" y1="62" x2="939" y2="62" stroke="#d0d0d0"/>

    <g font-size="12" fill="#404040">
      <text x="508" y="96">vpc</text>
      <text x="508" y="132">subnets</text>
      <text x="508" y="168">security</text>
      <text x="508" y="204">rds</text>
      <text x="508" y="240">alb</text>
      <text x="508" y="276">asg</text>
      <text x="508" y="312">route53</text>
      <text x="508" y="348">cloudfront</text>
    </g>
    <g fill="#e2e2e2">
      <rect x="622" y="85"  width="250" height="14" rx="3"/>
      <rect x="622" y="121" width="250" height="14" rx="3"/>
      <rect x="622" y="157" width="250" height="14" rx="3"/>
      <rect x="622" y="193" width="250" height="14" rx="3"/>
      <rect x="622" y="229" width="250" height="14" rx="3"/>
      <rect x="622" y="265" width="250" height="14" rx="3"/>
      <rect x="622" y="301" width="250" height="14" rx="3"/>
      <rect x="622" y="337" width="250" height="14" rx="3"/>
    </g>
    <g fill="#2563eb">
      <rect class="bar p0" x="622" y="85"  width="250" height="14" rx="3"/>
      <rect class="bar p1" x="622" y="121" width="250" height="14" rx="3"/>
      <rect class="bar p1" x="622" y="157" width="250" height="14" rx="3"/>
      <rect class="bar p2" x="622" y="193" width="250" height="14" rx="3"/>
      <rect class="bar p2" x="622" y="229" width="250" height="14" rx="3"/>
      <rect class="bar p2" x="622" y="265" width="250" height="14" rx="3"/>
      <rect class="bar p3" x="622" y="301" width="250" height="14" rx="3"/>
      <rect class="bar p3" x="622" y="337" width="250" height="14" rx="3"/>
    </g>
    <text x="508" y="396" font-size="11" fill="#404040">independent changes land in parallel</text>
    <text class="done dR" x="924" y="396" font-size="11" fill="#10b981" text-anchor="end">done</text>
  </g>
</svg>
